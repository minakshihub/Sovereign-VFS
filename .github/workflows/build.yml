name: Build Sovereign VFS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Install Dependencies (zlib & cmake)
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev cmake
        
      - name: Build BLAKE3 from Source
        run: |
          git clone https://github.com/BLAKE3-team/BLAKE3.git
          cd BLAKE3/c
          cmake .
          make
          
      - name: Compile Linux Binary
        run: g++ -std=c++20 -O3 sovereign_core.cpp -I./BLAKE3/c -L./BLAKE3/c -lblake3 -lz -o SovereignVFS-Linux
        
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SovereignVFS-Linux-Binary
          path: SovereignVFS-Linux

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup MSYS2 and Install Dependencies (Added mman-win32)
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-zlib mingw-w64-x86_64-cmake mingw-w64-x86_64-make git mingw-w64-x86_64-mman-win32
          
      - name: Build BLAKE3 from Source
        run: |
          git clone https://github.com/BLAKE3-team/BLAKE3.git
          cd BLAKE3/c
          cmake -G "MinGW Makefiles" .
          mingw32-make
          
      - name: Compile Windows Executable
        run: g++ -std=c++20 -O3 sovereign_core.cpp -I./BLAKE3/c -L./BLAKE3/c -lblake3 -lmman -lz -o SovereignVFS-Windows.exe
        
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SovereignVFS-Windows-EXE
          path: SovereignVFS-Windows.exe
